<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="instaGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#feda75;stop-opacity:1" />
      <stop offset="5%" style="stop-color:#fa7e1e;stop-opacity:1" />
      <stop offset="45%" style="stop-color:#d92e7f;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#9b36b7;stop-opacity:1" />
      <stop offset="90%" style="stop-color:#515bd4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#instaGradient)"/>
  
  <!-- Camera circle -->
  <circle cx="100" cy="75" r="25" fill="none" stroke="white" stroke-width="4"/>
  
  <!-- Camera lens -->
  <circle cx="100" cy="75" r="15" fill="none" stroke="white" stroke-width="3"/>
  
  <!-- Flash dot -->
  <circle cx="125" cy="55" r="4" fill="white"/>
  
  <!-- Bottom indicator line -->
  <rect x="50" y="125" width="100" height="3" rx="1.5" fill="white"/>
</svg>
